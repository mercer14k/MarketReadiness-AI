server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 130s;
        proxy_connect_timeout 5s;
    }
    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
