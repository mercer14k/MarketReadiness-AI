[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-readiness-ai"
version = "0.1.0"
description = "Evidence-first material readiness for infrastructure deployment"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.35,<1", "pydantic>=2.12,<3", "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "polars>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pip-audit>=2.9,<3", "PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["marketreadiness*", "apps.api*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
